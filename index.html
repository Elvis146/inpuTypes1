<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="style.css" rel="stylesheet" type="text/css"/>
</head>
<body>
<div class="container">
    <div class="content">
        <h1>Pizzeria Shop</h1>
        <form>
            <fieldset>
                <legend>Customer:</legend>
                <div class="row">
                    <div>
                        <label for="firstname">first</label>
                        <input id="firstname" name="first_name" type="text">
                    </div>
                    <div>
                        <label for="lastname">Last</label>
                        <input id="lastname" name="last_name" type="text">
                    </div>
                </div>
            </fieldset>
            <div class="row">
                <fieldset>
                    <legend>Flavor:</legend>
                    <div>
                        <input type="radio" id="pepperoni" name="Pizza">
                        <label for="pepperoni">Pepperoni</label>
                    </div>
                    <div>
                        <input type="radio" id="pineapple" name="pizza">
                        <label for="pineapple">Pineapple</label>
                    </div>
                    <div>
                        <input type="radio" id="cheese" name="Pizza">
                        <label for="cheese">Cheese</label>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Size:</legend>
                    <div>
                        <input type="radio" id="small" name="size">
                        <label for="small">Small</label>
                    </div>
                    <div>
                        <input type="radio" id="medium" name="size">
                        <label for="medium">Medium</label>
                    </div>
                    <div>
                        <input type="radio" id="large" name="size">
                        <label for="large">Large</label>
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Toppings:</legend>
                    <div>
                        <input type="checkbox" id="onions" name="onions" value="onions">
                        <label for="Onions">Onions</label>
                    </div>
                    <div>
                        <input type="checkbox" id="mushrooms" name="mushrooms" value="mushrooms">
                        <label for="mushrooms">Mushrooms</label>
                    </div>
                    <div>
                        <input type="checkbox" id="bell peppers" name="bell peppers" value="bell peppers">
                        <label for="bell peppers">Bell Peppers</label>
                    </div>
                </fieldset>
            </div>
            <fieldset>
                <legend>Box or tray:</legend>
                <label for="container">Please choose One</label>
                <select name="container" id="container">
                    <option value="cup">Plastic box</option>
                    <option value="sugar">Tray</option>
                    <option value="waffle">Cup</option>
                    <option value="dippedWaffle">Tomatoes with pizza</option>
                </select>
            </fieldset>
            <div>
            <fieldset>
                <legend>Special:</legend>
                <label for="SpecialRequests">Special Requests:</label>
                <textarea id="SpecialRequests" name="SpecialRequests" rows="4" cols="10"
                          placeholder="Allergic to peanuts, substitutions, etc"></textarea>
            </fieldset>
            <button type="button" onclick="alert('Free today for our Grand Opening!')">Calculate Cost</button>
            <button type="submit">Submit Order</button>
            </div>
            <div>
<!--                buttons-->
            </div>
        </form>
    </div>
</div>
</body>
</html>
